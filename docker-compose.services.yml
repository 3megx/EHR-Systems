# Docker Compose for EHR microservices
# Usage: docker-compose -f docker-compose.yml -f docker-compose.services.yml up

version: '3.8'

x-common-env: &common-env
  ASPNETCORE_ENVIRONMENT: Development
  Kafka__BootstrapServers: kafka:9092
  RabbitMQ__Host: rabbitmq
  RabbitMQ__Username: ehr_user
  RabbitMQ__Password: ehr_password
  RabbitMQ__VirtualHost: /ehr
  Jwt__Secret: "your-super-secret-key-change-in-production-at-least-32-characters-long!"
  Jwt__Issuer: ehr-platform
  Jwt__Audience: ehr-api

x-common-depends: &common-depends
  depends_on:
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  # ── API Gateway (YARP) ────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: EHRPlatform.Services.ApiGateway
    container_name: ehr-api-gateway
    ports:
      - "5000:5000"
    environment:
      <<: *common-env
      ConnectionStrings__Redis: redis:6379,password=redis_password
      Elasticsearch__Url: http://elasticsearch:9200
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ehr-network

  # ── Identity Service ──────────────────────────────────────────────────────────
  identity-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: EHRPlatform.Services.Identity
    container_name: ehr-identity-service
    ports:
      - "5001:5000"
    environment:
      <<: *common-env
      ConnectionStrings__IdentityDb: >
        Host=postgres-identity;Port=5432;Database=ehr_identity;
        Username=postgres;Password=postgres;
      ConnectionStrings__Redis: redis:6379,password=redis_password
    depends_on:
      postgres-identity:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ehr-network

  # ── Patient Service ───────────────────────────────────────────────────────────
  patient-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: EHRPlatform.Services.Patient
    container_name: ehr-patient-service
    ports:
      - "5002:5000"
    environment:
      <<: *common-env
      ConnectionStrings__DefaultConnection: >
        Host=postgres-patient;Port=5432;Database=ehr_patient;
        Username=postgres;Password=postgres;
      ConnectionStrings__Redis: redis:6379,password=redis_password
      Elasticsearch__Url: http://elasticsearch:9200
      EHRCommon__RedisConnectionString: redis:6379,password=redis_password
      EHRCommon__EncryptionKey: "your-encryption-key-32-chars-min!"
      EHRCommon__EnableCaching: "true"
    depends_on:
      postgres-patient:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ehr-network

  # ── Clinical Service ──────────────────────────────────────────────────────────
  clinical-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: EHRPlatform.Services.Clinical
    container_name: ehr-clinical-service
    ports:
      - "5003:5000"
    environment:
      <<: *common-env
      ConnectionStrings__ClinicalDb: >
        Host=postgres-clinical;Port=5432;Database=ehr_clinical;
        Username=postgres;Password=postgres;
      ConnectionStrings__Redis: redis:6379,password=redis_password
      Elasticsearch__Url: http://elasticsearch:9200
    depends_on:
      postgres-clinical:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ehr-network

  # ── Notification Service (SignalR + RabbitMQ + Kafka bridge) ─────────────────
  notification-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: EHRPlatform.Services.Notification
    container_name: ehr-notification-service
    ports:
      - "5006:5000"
    environment:
      <<: *common-env
      Cors__AllowedOrigins__0: http://localhost:4200
      Cors__AllowedOrigins__1: http://api-gateway:5000
    depends_on:
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ehr-network

networks:
  ehr-network:
    driver: bridge
