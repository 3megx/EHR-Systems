# Docker Compose for EHR microservices
# Usage: docker-compose -f docker-compose.yml -f docker-compose.services.yml up

version: '3.8'

services:
  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: EHRPlatform.Services.ApiGateway
    container_name: ehr-api-gateway
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__IdentityDb=Host=postgres-identity;Port=5432;Database=ehr_identity;Username=postgres;Password=postgres;
      - ConnectionStrings__Redis=redis:6379,password=redis_password
      - Elasticsearch__Url=http://elasticsearch:9200
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      postgres-identity:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ehr-network

  # Identity Service
  identity-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: EHRPlatform.Services.Identity
    container_name: ehr-identity-service
    ports:
      - "5001:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__IdentityDb=Host=postgres-identity;Port=5432;Database=ehr_identity;Username=postgres;Password=postgres;
      - ConnectionStrings__Redis=redis:6379,password=redis_password
      - Kafka__BootstrapServers=kafka:9092
      - Jwt__Secret=your-super-secret-key-change-in-production-at-least-32-characters-long!
    depends_on:
      postgres-identity:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ehr-network

  # Patient Service
  patient-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: EHRPlatform.Services.Patient
    container_name: ehr-patient-service
    ports:
      - "5002:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PatientDb=Host=postgres-patient;Port=5432;Database=ehr_patient;Username=postgres;Password=postgres;
      - ConnectionStrings__Redis=redis:6379,password=redis_password
      - Elasticsearch__Url=http://elasticsearch:9200
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      postgres-patient:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ehr-network

  # Clinical Service
  clinical-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: EHRPlatform.Services.Clinical
    container_name: ehr-clinical-service
    ports:
      - "5003:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ClinicalDb=Host=postgres-clinical;Port=5432;Database=ehr_clinical;Username=postgres;Password=postgres;
      - ConnectionStrings__Redis=redis:6379,password=redis_password
      - Elasticsearch__Url=http://elasticsearch:9200
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      postgres-clinical:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ehr-network

networks:
  ehr-network:
    driver: bridge
